<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Polyra Forge AR Demo</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background: #eee6dc;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #2b2520;
        }

        h1 {
            margin-top: 35px;
            font-size: 28px;
            letter-spacing: 3px;
        }

        p {
            margin-bottom: 20px;
            color: #6b625a;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            background: transparent;
        }
    </style>
</head>

<body>

    <h1>POLYRA FORGE</h1>

    <p>Where Craft Becomes Digital.</p>

    <model-viewer
        src="product.glb"
        alt="Polyra Forge 3D Product"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
